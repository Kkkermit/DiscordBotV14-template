version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go into develop like every other change, and reach main with the next release.
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # One pull request for all tooling updates instead of one per package.
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
