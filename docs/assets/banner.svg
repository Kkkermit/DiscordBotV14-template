<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Discord Bot V14 Template</title>
  <desc id="description">A beginner-friendly discord.js v14 bot template with slash commands, prefix commands, MongoDB and Docker.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f29"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7983f5"/>
      <stop offset="1" stop-color="#5865f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5865f2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#background)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <circle cx="1060" cy="180" r="260" fill="url(#glow)"/>

  <!-- Robot -->
  <g transform="translate(940 70)">
    <line x1="120" y1="6" x2="120" y2="40" stroke="#7983f5" stroke-width="8" stroke-linecap="round"/>
    <circle cx="120" cy="6" r="12" fill="#7983f5"/>
    <rect x="20" y="40" width="200" height="150" rx="40" fill="url(#accent)"/>
    <rect x="44" y="72" width="152" height="86" rx="28" fill="#111218"/>
    <circle cx="90" cy="115" r="15" fill="#57f287"/>
    <circle cx="150" cy="115" r="15" fill="#57f287"/>
    <rect x="0" y="92" width="20" height="46" rx="10" fill="#7983f5"/>
    <rect x="220" y="92" width="20" height="46" rx="10" fill="#7983f5"/>
    <rect x="70" y="200" width="100" height="18" rx="9" fill="#5865f2" fill-opacity="0.5"/>
  </g>

  <!-- Text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#a5acff" font-size="26" font-weight="600" letter-spacing="4">DISCORD.JS V14</text>
    <text x="78" y="186" fill="#ffffff" font-size="64" font-weight="800">Discord Bot Template</text>
    <text x="80" y="236" fill="#c9cdd8" font-size="26">Slash &amp; prefix commands, ready to build on.</text>

    <g font-size="20" font-weight="600" fill="#e3e5f2">
      <rect x="80" y="270" width="160" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="160" y="297" text-anchor="middle">Node.js 22+</text>
      <rect x="254" y="270" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="324" y="297" text-anchor="middle">MongoDB</text>
      <rect x="408" y="270" width="124" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="470" y="297" text-anchor="middle">Docker</text>
      <rect x="546" y="270" width="110" height="40" rx="20" fill="#ffffff" fill-opacity="0.08"/>
      <text x="601" y="297" text-anchor="middle">Tests</text>
    </g>
  </g>
</svg>
